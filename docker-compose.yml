services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: etken
      POSTGRES_PASSWORD: etken
      POSTGRES_DB: etken
    # Local only: not reachable from outside the host.
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    volumes: [etken-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etken"]
      interval: 2s
      retries: 30

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    # Secrets (JWT_SECRET, OPENAI_API_KEY, ...) come from server/.env.
    env_file: server/.env
    environment:
      DATABASE_URL: postgresql://etken:etken@db:5432/etken?sslmode=disable
      PORT: "8787"
    # Direct access on the host. With the Cloudflare tunnel set
    # API_BIND=127.0.0.1 so the API is reachable only through the tunnel.
    ports: ["${API_BIND:-0.0.0.0}:${API_PORT:-25925}:8787"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Keeps TİTCK data current: checks the drug lists every 6 hours and
  # imports a newer publication; refreshes announcements on each run.
  updater:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["sync_titck", "--every", "${SYNC_EVERY:-6h}"]
    env_file: server/.env
    environment:
      DATABASE_URL: postgresql://etken:etken@db:5432/etken?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true

  # Cloudflare Tunnel: publishes the API on your domain over HTTPS without
  # opening ports. In the Cloudflare dashboard (Zero Trust › Networks ›
  # Tunnels) add a public hostname pointing to http://api:8787.
  # Enabled by COMPOSE_PROFILES=tunnel in the root .env.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  etken-db:
